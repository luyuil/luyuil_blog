name: 自动更新日记数据

on:
  issues:
    types: [opened, edited, closed, reopened]
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-diary:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: 生成 diary.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python tools/update_diary.py

      - name: 有变化就提交并推送
        run: |
          git config user.name "luyuil-bot"
          git config user.email "luyuil@users.noreply.github.com"
          git add diary.json
          if git diff --cached --quiet; then
            echo "diary.json 没有变化"
            exit 0
          fi
          git commit -m "自动更新日记数据"
          git push
