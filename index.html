<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>luyuil_blog</title>
    <!-- 引入外部 CSS 文件 -->
    <link rel="stylesheet" href="./CSS/style.css">
    <link rel="stylesheet" href="./CSS/diary.css">
    <link rel="stylesheet" href="./CSS/study.css">
    <!-- marked.js 用于渲染 md（已本地化，不依赖外网 CDN） -->
    <script async src="./JavaScript/marked.min.js"></script>
</head>
<body>
    <!-- 视频背景 -->
    <video autoplay muted loop playsinline id="bg-video" poster="./image/poster.jpg">
        <source src="./image/Isla1.mp4" type="video/mp4">
        您的浏览器不支持视频标签。
    </video>
    
    <!-- 半透明遮罩（可选） -->
    <div class="overlay"></div>

    <!-- 中间卡片窗口 -->
    <div class="main-card">
        <div class="card-header">home</div>
        <div class="card-body">
            <h1 class="greeting">Hi, i'm <span class="highlight">luyuil</span></h1>
            <p class="subtitle">Just for fun</p>
            
            <!-- 卡片示例图标区 -->
            <div class="icon-row">
                <div class="icon-item" id="about-icon"><img src="./image/myself2.svg" alt="icon1"><span>about</span></div>
                <div class="icon-item" id="note-icon"><img src="./image/note.svg" alt="icon2"><span>note</span></div>
                <div class="icon-item" id="photo"><img src="./image/photo2.svg" alt="icon3"><span>photo</span></div>
                <div class="icon-item" id="link"><img src="./image/link.svg" alt="icon4"><span>link</span></div>
                <div class="icon-item" id="music-icon"><img src="./image/music.svg" alt="icon5"><span>music</span></div>
            </div>
        </div>
    </div>

    <!-- 底部社交图标 -->
    <div class="link-icons">
        <!-- GitHub 图标 -->
        <div class="social-icon" id="github-icon" title="GitHub">
            <img src="./image/github.svg" alt="GitHub">
        </div>
        <!-- Bilibili 图标 -->
        <div class="social-icon" id="bilibili-icon" title="Bilibili">
            <img src="./image/bilibili.jpg" alt="Bilibili">
        </div>
    </div>

    <!-- 引入外部 JS 文件 -->
    <script src="./JavaScript/windowAnimation.js"></script>
    <script src="./JavaScript/script.js"></script>
    <script src="./JavaScript/diary.js"></script>
    <script src="./JavaScript/study.js"></script>

    <!-- 在 <body> 末尾加入弹出窗口结构 -->
    <!-- about窗口 -->
    <div class="popup-window" id="about-window">
        <!-- 头部 -->
        <div class="popup-header" id="popup-header">
            <span class="popup-title">about me</span>
            <div class="window-controls">
                <!-- 关闭按钮 -->
                <span class="control-btn" id="close-btn" title="关闭">✕</span>
            </div>
        </div>

        <!-- 头像和简介 -->    
        <div class="profile-box">
            <!-- 头像 -->
            <div class="profile-avatar">
                <!-- 替换为你自己的头像图片 -->
                <img src="./image/isla3.jpg" alt="Avatar">
            </div>
            <!-- 右侧文字 -->
            <div class="profile-text">
                <h2>I'm <span class="english-name">Luyuil</span></h2>
                <p>A student studies computer science and automation</p>
            </div>
        </div>

            <!-- 内容区 -->
            <div class="popup-body">
                <!-- 这里由 JS 动态加载 md 文件内容 -->
                <div id="md-content">加载中...</div>
            </div>
    </div>
 
    <!-- note 下拉面板 (小窗口) -->
    <div class="note-menu-panel" id="note-menu-panel">
        <div class="note-menu-item" id="note-diary">日记</div>
        <div class="note-menu-item" id="note-study">学习笔记</div>
    </div>

    <!-- 日记大窗口 -->
    <div class="popup-window" id="diary-window">
        <div class="popup-header" id="diary-popup-header">
            <span class="popup-title">diary</span>
            <div class="window-controls">
                <span class="control-btn" id="diary-close-btn" title="关闭">✕</span>
            </div>
        </div>
        <div class="popup-body" id="diary-content">
            <!-- 发说说 + 说说时间线 -->
            <div class="diary-app" id="diary-app">
                <!-- 管理模式（访客看不到输入框，只有作者能发） -->
                <div class="diary-admin-bar" id="diary-admin-bar"></div>

                <!-- 发说说输入区（管理模式才显示） -->
                <div class="diary-composer" id="diary-composer" style="display:none">
                    <div class="diary-composer-head">
                        <img class="diary-avatar" src="./image/isla3.jpg" alt="avatar">
                        <textarea class="diary-input" id="diary-input" rows="2" placeholder="这一刻的想法…"></textarea>
                    </div>

                    <!-- 选中的图片预览 -->
                    <div class="diary-preview" id="diary-preview"></div>

                    <!-- 工具栏：加图片 + 发布 -->
                    <div class="diary-composer-toolbar">
                        <label class="diary-add-photo" title="添加图片（最多 9 张）">
                            <img src="./image/photo2.svg" alt="photo">
                            图片
                            <input type="file" id="diary-file" accept="image/*" multiple hidden>
                        </label>
                        <button class="diary-publish" id="diary-publish" disabled>发布</button>
                    </div>
                </div>

                <!-- 说说列表：最新的在最上面 -->
                <div class="diary-feed" id="diary-feed"></div>
            </div>
        </div>
    </div>

    <!-- 学习笔记大窗口 -->
    <div class="popup-window" id="study-window">
        <div class="popup-header" id="study-popup-header">
            <span class="popup-title">study note</span>
            <div class="window-controls">
                <span class="control-btn" id="study-close-btn" title="关闭">✕</span>
            </div>
        </div>
        <div class="popup-body" id="study-content">
            <!-- 左：文件夹树；右：笔记内容 -->
            <div class="study-app" id="study-app">
                <div class="study-sidebar">
                    <div class="study-sidebar-head">
                        <span>学习笔记</span>
                        <div class="study-sidebar-btns">
                            <button class="study-icon-btn" id="study-refresh" title="刷新">↻</button>
                            <button class="study-icon-btn" id="study-switch" title="更换文件夹">📂</button>
                        </div>
                    </div>
                    <div class="study-tree" id="study-tree"></div>
                </div>
                <div class="study-note" id="study-note">
                    <div class="study-loading">从左侧选择一篇笔记</div>
                </div>
            </div>
        </div>
    </div>

    <!-- photo窗口 -->
    <div class="popup-window" id="photo-window">
        <!-- 头部 -->
        <div class="popup-header" id="photo-popup-header">
            <span class="popup-title">photo</span>
            <div class="window-controls">
                <span class="control-btn" id="photo-close-btn" title="关闭">✕</span>
            </div>
        </div>

        <!-- 照片墙区域 -->
        <div class="popup-body photo-wall" id="photo-content">
            <!-- 图片将通过 JS 动态添加到这里 -->
        </div>
    </div>

    <!-- 点击图片后的大图预览弹层 -->
    <div class="photo-preview-overlay" id="photo-preview-overlay">
        <div class="photo-preview-box" id="photo-preview-box">
            <img id="preview-img" src="" alt="Preview">
            <span class="preview-close-btn" id="preview-close-btn">✕</span>
        </div>
    </div>

    <!-- link窗口 -->
    <div class="popup-window" id="link-window">
        <!-- 头部 -->
        <div class="popup-header" id="link-popup-header">
            <span class="popup-title">links</span>
            <div class="window-controls">
                <span class="control-btn" id="link-close-btn" title="关闭">✕</span>
            </div>
        </div>

        <!-- 内容区（自动排版） -->
        <div class="popup-body" id="link-content">
            <!-- 项目将通过 JS 动态添加到这里 -->
        </div>
    </div>
    
</body>
</html>
